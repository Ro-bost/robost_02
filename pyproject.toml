[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robost"
version = "0.3.0"
description = "MuJoCo simulation and locomotion controllers for the RS06 v5 quadruped"
readme = "README.md"
requires-python = ">=3.11,<3.12"
keywords = ["quadruped", "mujoco", "robotics", "reinforcement-learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.16.10"]
simulation = [
  "imageio==2.37.4",
  "imageio-ffmpeg==0.6.0",
  "mujoco==3.11.0",
  "numpy==2.4.6",
  "pillow==12.3.0",
]
analysis = ["matplotlib==3.11.2"]

[project.urls]
Repository = "https://github.com/Ro-bost/robost_02"
Releases = "https://github.com/Ro-bost/robost_02/releases"

[project.scripts]
robost-preview = "robost.simulation.model:main"
robost-scene = "robost.cli.scene:main"
robost-stairs = "robost.cli.stairs:main"
robost-evaluate = "robost.cli.evaluate:main"
robost-train = "robost.cli.train:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["robost*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F"]
