name: Source and CPU regression checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    env:
      MUJOCO_GL: osmesa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: config/requirements-mujoco.txt
      - run: sudo apt-get update && sudo apt-get install -y libosmesa6
      - run: python -m pip install -r config/requirements-mujoco.txt
      - run: python scripts/bootstrap_third_party.py --only Cheetah-Software eigen3
      - run: make check test-core
      - run: python scripts/export_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: robost-source
          path: dist/robost-source.tar.gz
