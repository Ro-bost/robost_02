name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    env:
      MUJOCO_GL: osmesa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y libosmesa6
      - run: python -m pip install -e '.[simulation,dev]'
      - run: make check lint test-core
      - run: robost-preview --check
      - run: robost-scene --check --output /tmp/robost-ci-scene
